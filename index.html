<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Agent Academy — interactive Copilot Studio training for business users"
    />
    <script>
      try {
        var raw = localStorage.getItem('agent-academy-v1')
        var theme = raw ? JSON.parse(raw).theme : 'dark'
        if (theme !== 'light') theme = 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
        document.documentElement.style.colorScheme = 'dark'
      }
    </script>
    <script>
      // Restore deep-link path after GitHub Pages 404 → index redirect.
      try {
        var redirect = sessionStorage.getItem('gh-pages-redirect')
        if (redirect) {
          sessionStorage.removeItem('gh-pages-redirect')
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', redirect)
          }
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />
    <title>Agent Academy · Copilot Studio Training</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
